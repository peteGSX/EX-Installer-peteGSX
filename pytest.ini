[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --cov=tests
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-report=lcov
    --cov-report=html-clover
    --cov-report=html-terminal
    --cov-report=term-missing
    --cov-fail-under=80
